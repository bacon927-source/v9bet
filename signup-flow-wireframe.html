<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V9Bet · Sign Up — Wireframe</title>
<style>
  :root{
    --ink:#2b2b2b; --line:#c9c9c9; --line2:#9a9a9a; --muted:#8a8a8a;
    --paper:#ffffff; --bg:#ececed; --fill:#f3f3f4; --solid:#3a3a3a;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Noto Sans TC",Arial,sans-serif;color:var(--ink);background:var(--bg)}
  /* ---- layout ---- */
  .app{display:grid;grid-template-columns:260px 1fr 340px;min-height:100vh}
  aside{background:var(--paper);border-right:1px solid var(--line);padding:16px;overflow:auto}
  main{padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .spec{background:var(--paper);border-left:1px solid var(--line);padding:16px;overflow:auto}
  h1{font-size:15px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin:0 0 14px}
  .navlist{display:flex;flex-direction:column;gap:2px}
  .nav{display:flex;gap:8px;align-items:center;border:1px solid transparent;border-radius:6px;padding:7px 8px;cursor:pointer;font-size:13px}
  .nav:hover{background:var(--fill)}
  .nav.active{background:#e3e3e6;border-color:var(--line2);font-weight:600}
  .nav .num{width:20px;height:20px;flex:0 0 20px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--muted)}
  .nav.active .num{background:var(--solid);color:#fff;border-color:var(--solid)}
  .group-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  /* ---- phone ---- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:10px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
  .btn:hover{background:var(--fill)}
  .state-tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff}
  .state-tabs button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted)}
  .state-tabs button.on{background:var(--solid);color:#fff}
  .phone{width:380px;border:2px solid var(--ink);border-radius:28px;background:var(--paper);padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
  .notch{height:20px;display:flex;justify-content:center}
  .notch::after{content:"";width:120px;height:18px;background:var(--ink);border-radius:0 0 12px 12px}
  .screen{height:680px;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;position:relative}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;border-radius:17px;z-index:5}
  .modal{background:#fff;border-radius:14px;padding:16px 18px;width:100%;box-shadow:0 12px 34px rgba(0,0,0,.3)}
  .modal b{font-size:15px}
  .screen::-webkit-scrollbar{width:6px}.screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .scr-title{text-align:center;font-weight:700;font-size:16px;margin:2px 0 4px;position:relative}
  .scr-title .x{position:absolute;left:0;top:0;color:var(--muted);font-weight:400}
  .authsw{display:flex;align-items:center;justify-content:center;gap:14px}
  .authsw .on{font-size:21px;font-weight:800;letter-spacing:-.2px}
  .authsw .off{font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer}
  .authsw .div{width:1px;height:22px;background:var(--line2)}
  .scr-step{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
  /* wireframe primitives */
  .field{border:1px dashed var(--line2);border-radius:10px;padding:13px 14px;color:var(--muted);margin:10px 0;display:flex;justify-content:space-between;align-items:center;background:var(--fill)}
  .field small{color:#b0b0b0}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .opt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;gap:12px}
  .opt.sel{border-color:var(--solid);border-width:2px}
  .dot{width:18px;height:18px;border:1px solid var(--line2);border-radius:50%;flex:0 0 18px}
  .dot.on{border-color:var(--solid);border-width:5px}
  .sq{width:18px;height:18px;border:1px solid var(--line2);border-radius:4px;flex:0 0 18px}
  .sq.on{background:var(--solid)}
  .ph{height:90px;border:1px dashed var(--line2);border-radius:10px;display:grid;place-items:center;color:#b6b6b6;background:var(--fill);margin:10px 0}
  .cta{background:var(--solid);color:#fff;text-align:center;border-radius:24px;padding:14px;margin:16px 0 8px;font-weight:600}
  .cta.ghost{background:#fff;color:var(--muted);border:1px solid var(--line2)}
  .cta.disabled{background:#cfcfcf;color:#fff}
  .link{text-align:center;color:#666;font-size:13px;margin-top:8px}
  .link b{color:var(--ink);text-decoration:underline}
  .hint{font-size:12px;color:var(--muted);margin:6px 2px}
  .badge{display:inline-block;font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--muted);vertical-align:middle;margin-left:6px}
  .badge.req{border-color:#b56;color:#b56}
  .otpcells{display:flex;gap:8px;justify-content:center;margin:18px 0}
  .otpcells span{width:42px;height:52px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
  .otpcells span.f{border-color:var(--solid);border-width:2px}
  .err{border:1px solid #c98;background:#fbf2ef;color:#a55;border-radius:8px;padding:10px 12px;font-size:12px;margin:8px 0}
  .checklist .ci{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
  .checklist .ci .num{width:22px;height:22px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--muted);flex:0 0 22px}
  .checklist .ci.done .num{background:var(--solid);color:#fff;border-color:var(--solid)}
  .checklist .ci .g{flex:1}
  .checklist .ci .g small{color:var(--muted);font-size:11px;display:block}
  .checklist .ci .pts{background:#fef6e0;border:1px solid #eccb7a;color:#8a6d1a;font-size:10.5px;font-weight:800;border-radius:12px;padding:3px 9px;margin-left:6px;white-space:nowrap;flex:0 0 auto}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
  .dots i.on{background:var(--solid);width:18px;border-radius:4px}
  .promo{border:1px dashed var(--line2);border-radius:12px;padding:14px;margin:10px 0;background:var(--fill)}
  .promo .tag{font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--muted)}
  /* social login */
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:14px 0 4px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .socbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;margin:8px 0;font-size:13px;background:#fff;cursor:pointer}
  .socbtn .ic{width:22px;height:22px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--muted);flex:0 0 22px}
  .socbtn small{margin-left:auto;color:#b0b0b0;font-size:10px}
  .socbtn .last{margin-left:auto;font-size:9px;border:1px solid var(--solid);border-radius:4px;padding:1px 5px;color:var(--solid)}
  .ccpop{border:1px solid var(--line2);border-radius:10px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.08);margin:-4px 0 10px;overflow:hidden}
  .ccpop .cc{padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:8px;color:#444}
  .ccpop .cc.on{background:var(--fill);font-weight:700}
  .ccpop .cc small{margin-left:auto;color:#b0b0b0}
  .mtabs{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13px;text-align:center}
  .mtabs span{flex:1;padding:9px 0;color:var(--muted);background:var(--fill)}
  .mtabs span.on{background:#fff;color:#222;font-weight:700;box-shadow:inset 0 -2px 0 var(--solid)}
  .socrow .sic{position:relative}
  .socrow .lu{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;border:1px solid var(--solid);color:var(--solid);background:#fff;border-radius:4px;padding:0 4px;white-space:nowrap}
  .prog3{display:flex;gap:5px;margin:10px 0 2px}
  .prog3 .p{flex:1;font-size:9.5px;text-align:center;padding:5px 0;border:1px solid var(--line2);border-radius:7px;color:var(--muted);background:var(--fill)}
  .prog3 .p.on{background:var(--solid);border-color:var(--solid);color:#fff;font-weight:700}
  .prog3 .p.done{border-color:var(--solid);color:var(--solid)}
  .grp{font-size:11px;font-weight:700;color:#555;margin:12px 0 2px;display:flex;align-items:center;gap:6px}
  .pbar{height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden;margin:4px 0 2px}
  .pbar i{display:block;height:100%;background:var(--solid)}
  .pbar-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:4px}
  .socrow{display:flex;justify-content:center;gap:24px;margin:12px 0 4px}
  .socrow .sic{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .socrow .c{width:46px;height:46px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);background:#fff}
  .socrow small{font-size:10px;color:var(--muted)}
  /* spec panel */
  .spec h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
  .spec h2:first-child{margin-top:0}
  .spec ul{margin:0;padding-left:16px}
  .spec li{margin:4px 0;font-size:12.5px}
  .stlist{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:11px;border:1px solid var(--line2);border-radius:12px;padding:2px 9px;background:var(--fill)}
  .api{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--fill);border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap;color:#555}
  .legend{font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT: flow nav -->
  <aside>
    <h1>Sign Up</h1>
    <p class="sub">Low-fidelity wireframe · Mobile / App first<br>Source: New customers sign up flow (Jun 10)<br>+ 3rd-party login & verify methods (auth-flow-analysis, Jul 8)</p>
    <div id="nav"></div>
    <div class="legend">
      Grayscale wireframe only, no visual design.<br>
      <span class="badge req">Required</span> = mandatory ·
      <span class="badge">app only</span> = App only<br>
      Right panel: spec / states / API fields for Dev.
    </div>
  </aside>

  <!-- CENTER: phone -->
  <main>
    <div class="toolbar">
      <button class="btn" id="prev">← Previous</button>
      <div class="state-tabs" id="states"></div>
      <button class="btn" id="next">Next →</button>
    </div>
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen"></div>
    </div>
    <div class="hint" id="bread"></div>
  </main>

  <!-- RIGHT: spec -->
  <div class="spec" id="spec"></div>
</div>

<script>
/* ---------- wireframe component helpers ---------- */
const F = (label, sub='') => `<div class="field"><span>${label}</span>${sub?`<small>${sub}</small>`:''}</div>`;
const CTA = (t, mod='') => `<div class="cta ${mod}">${t}</div>`;
const OPT = (t, sel=false, kind='dot') => `<div class="opt ${sel?'sel':''}"><span class="${kind} ${sel?'on':''}"></span><span style="flex:1">${t}</span></div>`;
const SOC = (ic, t, sub='', last=false) => `<div class="socbtn"><span class="ic">${ic}</span><span>${t}</span>${last?`<span class="last">Last used</span>`:sub?`<small>${sub}</small>`:''}</div>`;

/* ---------- screen definitions ---------- */
const screens = [
{
  group:"A · Sign Up", id:"signup", title:"Sign Up",
  states:["Default","Ready to submit","Account exists → popup","Referral from invite link"],
  render:(s)=>`
    <div class="scr-title"><span class="authsw"><span class="on">Sign up</span><span class="div"></span><span class="off">Login</span></span><span class="x" style="left:auto;right:0">✕</span></div>
    <div class="scr-step">Sign up with your email</div>
    <div class="socrow" style="margin-top:14px">
      <div class="sic"><span class="c">G</span><small>Google</small></div>
      <div class="sic"><span class="c" style="font-size:10px">LINE</span><small>LINE</small></div>
      <div class="sic"><span class="c" style="font-size:9px">Zalo</span><small>Zalo</small></div>
    </div>
    <div class="or">or sign up with</div>
    ${F("Email address","Required")}
    ${s===3
      ? `<div class="field" style="border-style:solid;color:var(--ink)"><span>V9-8KQ2MN</span><small>From invite link ✓</small></div>`
      : F("Referral code","Optional")}
    <div class="opt"><span class="sq ${s===1||s===3?'on':''}"></span>
      <span style="flex:1">I am 21+ and agree to the <b style="text-decoration:underline">Terms</b> and <b style="text-decoration:underline">Privacy Policy</b></span></div>
    <div class="hint">＊ We send a 6-digit code to this inbox — that code is the whole verification. No password to choose, nothing else to fill in.</div>
    ${CTA("Sign Up", s>=1?'':'disabled')}
    ${s===2?`<div class="scrim"><div class="modal">
      <div style="text-align:right;color:var(--muted);margin:-4px -4px 0">✕</div>
      <b style="display:block;text-align:center">The account already exists</b>
      <div class="hint" style="text-align:center;margin:6px 0 10px">We sent a code to <b>ba*****on@gmail.com</b>. Enter it to log in to your account.</div>
      <div class="field" style="border-style:solid;margin:0"><span>Enter code</span><small style="border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:#666">Paste</small></div>
      <div class="hint" style="text-align:center;margin:8px 0 0">Resend in 54s</div>
      ${CTA("Log in")}
      <div class="link"><b>Use a different email</b></div>
    </div></div>`:''}`,
  spec:{
    goal:"Sign-up = email + OTP only. No phone, no password, no Account ID. One optional extra: a referral code field under the email. 3rd-party via icon row: Google / LINE / Zalo (consent implicit at tap).",
    states:["default (button disabled until Terms checked)","Terms checked → submittable","email already registered → popup: code sent, confirm to log in","referral code prefilled from ?ref= invite link, marked applied (still editable)","invalid email format → inline error","referral code not found / expired → inline error under that field only; Sign Up stays enabled","submitting loading","social icon tap → Google / LINE / Zalo OAuth branch"],
    fields:["email","referral_code (optional)","accept_terms(bool)","method(email|google|line|zalo)"],
    api:"POST /register/start\n→ { email, referral_code?, accept_terms }\n← { register_token, otp_sent:true }\nerr: INVALID_EMAIL / RATE_LIMITED\n← { exists:true, otp_sent:true } when the address already has an account\nGET /referral/validate?code= → { valid, inviter_display? } (on blur; never blocks submit)\nerr: REFERRAL_NOT_FOUND / REFERRAL_EXPIRED — warn, do not fail registration\nGET auth.&lt;stable&gt;/oauth/{provider} → session_token (central auth domain)",
    notes:["Modal, not an inline card (08-30): centred over a dimmed scrim, so it reads as a decision that interrupts the form rather than a message appended below the Sign Up button. Dismissing it via ✕ or 'Use a different email' returns to the form with the address cleared.","The code is entered INSIDE the modal (08-30) — field with a Paste affordance, resend countdown, and a Log in button — rather than navigating to the OTP screen. The member keeps their place: one interruption, resolved where it appeared, and they land signed in.","An existing email is NOT an error (08-30) — it is told plainly, in a popup: 'You already have an account, we've sent a code, confirm it and we'll log you in.' Submitting sends the code either way; only the popup distinguishes the two cases. A new address gets an account; an existing one gets signed in after the same code, so the member never has to back out and start over on the Login screen.","Tradeoff accepted deliberately: naming the account to someone who has not yet authenticated does confirm that address is registered, which Login and Forgot Password specifically avoid. It is allowed here because the alternative — silently sending a code and saying nothing — leaves a member who simply forgot they had signed up staring at a screen that looks like it did nothing. Rate-limit this endpoint per address and per IP so it cannot be used to test addresses in bulk.","What happens after the code passes is on the Existing Account screen: dormant reactivates, active just signs in, restricted stops at Live Chat.","EMAIL ONLY (08-30): phone number can no longer be used to register. The Phone | Email tabs, the TH/VN country-code picker and the paste-detection behaviour are all gone — there is one field. Phone becomes something the member adds later (Setup Step 2 / Settings), which is the exact reverse of the previous arrangement where email was the optional add-on.","Knock-on to check when reading the rest of this kit: sign-up OTP is now always an inbox code, never SMS; a brand-new member has NO phone on file, so anything that assumed one (SMS message channel, phone-as-KYC-anchor, SMS as the default OTP delivery) only applies after they add one.","No Captcha (08-30, removed): it was drawn as a conditional risk-triggered step. Email OTP already gates account creation — an attacker needs a real inbox per account — so the extra friction bought little. Risk control can still throttle server-side (rate limits, disposable-domain checks) without a visible challenge.","No password and no Account ID at sign-up (final, Jul 16): email + OTP is the whole registration. Password is OPTIONAL — set later in Setup Step 2 for password login; until then the member logs in via one-time code / social / passkey.","Deferring language / currency does NOT hurt member→customer conversion: the account is created as soon as this page + OTP (or social consent) completes. Mitigations for each deferred item — currency: setup Step 1, and force-prompted at first deposit intent (gates deposit, not sign-up); language: auto-detected from locale / geo-IP with an always-visible switcher in the header. (Referral was on this deferred list until 09-17 — see the referral notes below for why it came back onto the form.)",
"REFERRAL CODE FIELD ADDED (09-17, business request): an optional field sitting directly under Email address. It was previously deferred off this screen entirely, on the argument that ?ref= auto-capture plus a 7-day manual window in Promotions covered it without putting another box on the registration form. Reversed because that only ever worked for people who arrived by clicking a link: a code passed by word of mouth — said in person, pasted into a group chat, screenshotted — had nowhere to go at the moment the member was actually thinking about it, and the Promotions back-fill was invisible to anyone who did not already know it existed.",
"Optional, and it must NEVER block registration (09-17): an empty field submits normally, and a wrong or expired code fails the CODE, not the sign-up — show the error inline under that field, leave Sign Up enabled, and create the account. The 7-day back-fill in Promotions stays as the recovery path. Validate on blur (GET /referral/validate) so the member finds out while they can still fix a typo, rather than after the account already exists.",
"Arriving via ?ref= prefills the field and marks it 'From invite link ✓' (4th state) — the auto-capture decision is unchanged, the field only makes it visible so the member can see what they are being credited with. Keep it EDITABLE, not locked: someone holding both a link and a friend's code should be able to choose, and a locked field showing a code they do not recognise reads as a tracking artefact. Attribution rule when both exist: whatever is in the field at submit wins.",
"Social sign-up has no field to type into, so the rule there is unchanged: ?ref= is captured server-side against the session before the OAuth hop and applied when the account is created. A member who signs up with Google while holding a word-of-mouth code enters it in Promotions within 7 days — the manual field on this screen is the email path only.",
"Field placement is deliberate: BELOW email, ABOVE the 21+ / Terms checkbox. It stays out of the way of the one field that is actually required, and it stays above the consent row so the checkbox keeps its position as the last thing before the button.","Account ID is AUTO-GENERATED at registration (e.g. AHHHHHH) — never typed by the member: shown read-only in Personal Information, revealed in Forgot Password after OTP; the registered email may also be used as Account ID. Login accepts Account ID / email / phone in one field (phone only once the member has added one).","Terms not checked → Sign Up disabled.","Login entry moved to the top-LEFT of the title bar (Jul 16); ✕ close moves to the right; bottom 'Login here' link removed.","Social icons promoted to the TOP of the screen (Jul 16, same layout as Login). The 21+ / Terms checkbox below is SHARED by every method — social included: tapping an icon while it is unchecked shows an inline prompt to accept first, and the checked state is the recorded consent (timestamp + terms version). No separate consent line under the icons, and no re-ask in Complete Setup. Icons only (no full-width buttons): Google / LINE / Zalo. Visibility is market-aware — hide an icon where the provider is blocked or irrelevant (e.g. LINE strongest in TH). Telegram entry removed from this screen. Apple / Facebook still excluded (policy).","FACEBOOK REQUESTED, PENDING BUSINESS CONFIRMATION (09-20). Asked for as a provider; NOT drawn, because Facebook Login is not a free choice for this product. Meta's platform terms treat real-money gambling as restricted: the app has to be approved for it and is only permitted in the jurisdictions Meta lists, which VN and TH are not among by default. So the open question is not a design one — it is whether the business has, or can get, that approval. Confirm before this is wireframed; building the flow first risks specifying an entry point that cannot ship. Same reasoning already keeps Apple out.","All social icons go through the central verification domain (auth.&lt;stable&gt;) so public mirror rotation never breaks OAuth.","Analytics: sign_up event must carry method param (email | google | line | zalo) — phone_otp retired. Add referral_source (link | manual | none) so the two entry paths can be compared — the whole case for the manual field rests on 'manual' being non-trivial, so it needs to be measurable."]
  }
},
{
  group:"A · Sign Up", id:"otp", title:"OTP Verification",
  states:["In progress (00:32)","Done → Verify","Resend available","Invalid OTP","Resend over 3rd → 03:00"],
  render:(s)=>{
    const cell=(t,mod)=>`<span style="${mod==='g'?'border-color:#3a3a3a;border-width:2px;':mod==='r'?'border-color:#b56;border-width:2px;color:#b56;':''}">${t}</span>`;
    const cells= s===0?[1,2,3,4,5].map(n=>cell(n,'g')).join('')+cell('_','')
      : s===1?[1,2,3,4,5,6].map(n=>cell(n,'g')).join('')
      : s===3?[1,2,3,4,5,4].map(n=>cell(n,'r')).join('')
      : ['_','_','_','_','_','_'].map(n=>cell(n,'')).join('');
    return `
    <div class="scr-title"><span class="x">✕</span>Verify Email</div>
    <div class="scr-step">We sent a code to<br><b>ba*****on@gmail.com</b></div>
    <div class="otpcells">${cells}</div>
    ${s===3?`<div class="err">Invalid OTP entered</div>`:''}
    ${s===2?`<div class="link"><b>Resend OTP</b></div>`
      :`<div class="link">Resent code in <b>${s===3?'00:11':s===4?'03:00':'00:32'}</b></div>`}

  spec:{
    goal:"Social sign-up (Google / LINE / Zalo icons) via the central verification domain — NO OTP for a brand-new account: provider consent → immediate 'You're now a customer' welcome, identical for every provider, which pushes into the standard Setup Overview. Providers still split into two kinds by what they hand over, but that difference is now resolved at Setup Step 1 (does the account have a verified contact?), not by branching this welcome. When the identity matches an EXISTING account, ownership of that account is re-proved before linking rather than logging straight in.",
    states:["provider consent (Google One Tap / LINE / Zalo, no in-app redirect screen)","brand-new account → ONE welcome, identical for every provider","existing match → Account Found, offers to link","re-auth → OTP to the EXISTING account's contact (not the new provider)","OTP correct → bound & logged in as the existing account","cancelled / provider error → back to sign-up"],
    fields:["provider(google|line|zalo)","session_token","accept_terms(implicit — recorded at social tap on Sign Up)","existing_account_phone_masked","otp_code"],
    api:"GET auth.&lt;stable&gt;/oauth/{provider}\n← redirect back with session_token\nPOST /auth/social/exchange { session_token }\n← { customer_id, is_new, needs_bind, existing_account_phone_masked }\nPOST /auth/social/bind/otp/send { customer_id }\nPOST /auth/social/bind/otp/verify { customer_id, otp } → bind + login",
    notes:["'Complete Setup (currency-only)' screen removed (Jul 16) — redundant with Setup Overview, which already collects currency as Step 1 · Required right after. Brand-new social members land on Welcome immediately, no OTP.","No 'Start playing' escape on Welcome (08-30): it let a social member walk past setup entirely, and Step 1 is not optional. The only way on is 'Set up account', with a line saying why. Removing the second button also stops the reward framing reading as a bribe for something that was never really a choice.","Account-linking rule (market standard — Auth0 account linking / Google Identity Platform 'account-exists-with-different-credential'): request authentication for BOTH sides before linking. Google proves the new identity; an OTP to the phone already on file proves the existing account. Binding straight off the provider's say-so alone (no re-auth) is the weaker 'automatic linking' mode both platforms flag as a security tradeoff — not used here.","Match only ever surfaces 'Account Found' against a VERIFIED email/phone on the existing account — an unverified stored contact never triggers it, or anyone could plant someone else's real email on a dormant account and hijack it the moment the real owner signs in with Google. Zalo / LINE match on their provider account ID instead, since that is all they give us.","ONE WELCOME FOR EVERY PROVIDER (09-17). There used to be two: Google got a plain 'you're a customer' screen, Zalo / LINE got a warning panel and an 'Add an email' primary button. That split is gone. Reason: it made the welcome carry a job it could not finish — the Add-an-email button sat beside a 'Later' escape, so the member could walk past it and still end up with an account we cannot reach, and a Google member was reading a screen designed around a problem they did not have. The missing-contact requirement moved to where requirements are actually enforced: Setup Step 1 (see Setup Overview state 4). The welcome is now one screen that says the account exists and points at setup.",
"The provider difference did NOT go away — it moved (09-17). Do not read the single welcome as 'every provider is the same'. What changed is WHERE the difference is handled: not by branching the welcome on which icon was tapped, but by checking one fact at Setup — does this account have a verified email or phone? That test is provider-agnostic, so it keeps working if LINE's email permission is granted later, or if a future provider behaves differently, without anyone having to remember to re-branch this screen.",

/* small components used inside screens */
function ci(n,label,tag,done){
  let pts='';
  if(tag){ const m=tag.match(/\+(\d+)\s*pts$/); if(m){ pts=m[1]; tag=tag.replace(/\s*·?\s*\+\d+\s*pts$/,'').trim(); } }
  return `<div class="ci ${done?'done':''}"><span class="num">${done?'✓':n}</span><span class="g">${label}${tag?`<small>${tag}</small>`:''}</span>${pts?`<span class="pts">🎁+${pts}</span>`:''}<span style="color:#bbb">›</span></div>`;
}
function tog(label,on){return `<div class="opt"><span style="flex:1">${label}</span><span style="width:40px;height:22px;border-radius:12px;border:1px solid var(--line2);background:${on?'var(--solid)':'#fff'};position:relative"><span style="position:absolute;top:2px;${on?'right:2px':'left:2px'};width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid var(--line2)"></span></span></div>`}

/* ---------- runtime ---------- */
let idx=0, st=0;
const navEl=document.getElementById('nav');
function buildNav(){
  let html='', lastG='';
  screens.forEach((sc,i)=>{
    if(sc.group!==lastG){html+=`<div class="group-title">${sc.group}</div>`;lastG=sc.group;}
    html+=`<div class="nav ${i===idx?'active':''}" data-i="${i}"><span class="num">${i+1}</span>${sc.title}</div>`;
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{idx=+n.dataset.i;st=0;draw();});
}
function draw(){
  const sc=screens[idx];
  document.getElementById('screen').innerHTML=sc.render(st);
  // states
  const stWrap=document.getElementById('states');
  stWrap.innerHTML=sc.states.map((s,i)=>`<button class="${i===st?'on':''}" data-s="${i}">${s}</button>`).join('');
  stWrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{st=+b.dataset.s;draw();});
  document.getElementById('bread').textContent=`Screen ${idx+1} / ${screens.length} · ${sc.title}${sc.step?' · '+sc.step:''}`;
  // spec
  const sp=sc.spec;
  document.getElementById('spec').innerHTML=`
    <h2>Screen Goal</h2><p style="font-size:13px;margin:0">${sp.goal}</p>
    <h2>States</h2><div class="stlist">${sp.states.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
    <h2>Fields</h2><div class="stlist">${sp.fields.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
    <h2>API / Data</h2><div class="api">${sp.api}</div>
    <h2>Dev Notes</h2><ul>${sp.notes.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  buildNav();
}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;st=0;draw();}};
document.getElementById('next').onclick=()=>{if(idx<screens.length-1){idx++;st=0;draw();}};
draw();
</script>
<script>
/* ---------- ✏️ 文字編輯模式：右下角開關，點字直接改；存 localStorage，重整 / 切畫面不會消失 ---------- */
(function(){
const FILE=location.pathname.split('/').pop()||'page';
const KEY='wfTextEdits:'+FILE;
const DYN=['screen','spec','bread'];                                   // draw() 重繪的區塊
const STATIC=[['aside h1','h1'],['aside .sub','sub'],['aside .legend','legend']]; // 靜態區塊
const dynKey=id=>id==='screen'?`d|${idx}|${st}|screen`:`d|${idx}|${id}`;
const nodes=el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),a=[];let n;while(n=w.nextNode())a.push(n);return a};
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return{edits:d.edits||{},orig:d.orig||{}}}catch(e){return{edits:{},orig:{}}}};
const persist=d=>localStorage.setItem(KEY,JSON.stringify(d));
const fresh={};                                                        // 每個 key 的原始文字（重繪後快照）
function applyKey(el,k){const v=load().edits[k];if(!v)return;const ns=nodes(el);for(let i=0;i<Math.min(ns.length,v.length);i++)ns[i].nodeValue=v[i]}
function snapApply(el,k){if(!(k in fresh))fresh[k]=nodes(el).map(n=>n.nodeValue);applyKey(el,k)}
function record(el,k){
  const d=load(),cur=nodes(el).map(n=>n.nodeValue),o=fresh[k]||d.orig[k];
  if(o&&cur.length===o.length&&cur.every((t,i)=>t===o[i])){delete d.edits[k];delete d.orig[k]}
  else{d.edits[k]=cur;if(o&&!d.orig[k])d.orig[k]=o}
  persist(d);flash('已儲存 ✓')}
const _draw=draw;
draw=function(){_draw();DYN.forEach(id=>{const el=document.getElementById(id);if(el)snapApply(el,dynKey(id))})};
STATIC.forEach(([sel,k])=>{const el=document.querySelector(sel);if(el){snapApply(el,'s|'+k);el.addEventListener('input',()=>record(el,'s|'+k))}});
DYN.forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>record(el,dynKey(id)))});
draw();                                                                // 載入時套用已存的修改
/* --- 編輯開關 --- */
let editing=false;
const plainOK=(()=>{const t=document.createElement('div');try{t.contentEditable='plaintext-only'}catch(e){return false}return t.contentEditable==='plaintext-only'})();
const editables=()=>DYN.map(id=>document.getElementById(id)).concat(STATIC.map(([sel])=>document.querySelector(sel))).filter(Boolean);
function setEditing(on){editing=on;
  editables().forEach(el=>{if(on){el.setAttribute('contenteditable',plainOK?'plaintext-only':'true');el.setAttribute('spellcheck','false')}else{el.removeAttribute('contenteditable')}});
  document.body.toggleAttribute('data-editing',on);
  const b=document.getElementById('eb-toggle');b.textContent=on?'✅ 完成':'✏️ 編輯文字';b.classList.toggle('on',on);
  flash(on?'點畫面上的字直接修改（自動儲存）':'')}
document.addEventListener('beforeinput',e=>{if(editing&&!plainOK&&(e.inputType==='insertParagraph'||e.inputType==='insertLineBreak'))e.preventDefault()},true);
/* --- 工具列 --- */
const css=document.createElement('style');css.textContent=`
#editbar{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid #d0d3d8;border-radius:10px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.14);font:12px/1.4 -apple-system,"Noto Sans TC",Arial,sans-serif}
#editbar button{font:inherit;border:1px solid #d0d3d8;background:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;color:#333}
#editbar button:hover{border-color:#19c37d;color:#0f8a5f}
#editbar #eb-toggle.on{background:#19c37d;border-color:#19c37d;color:#fff}
#eb-msg{color:#0f8a5f;font-size:11px;max-width:170px}
body[data-editing] [contenteditable]{outline:1.5px dashed #19c37d;outline-offset:3px;border-radius:3px;cursor:text}
body[data-editing] [contenteditable]:focus{outline-style:solid}`;
document.head.appendChild(css);
const bar=document.createElement('div');bar.id='editbar';
bar.innerHTML=`<button id="eb-toggle" title="開啟後直接點畫面文字修改，自動儲存在此瀏覽器">✏️ 編輯文字</button><button id="eb-copy" title="複製修改清單（原文 → 新文），可貼給 Claude 寫回 HTML">📋 複製修改</button><button id="eb-reset" title="清除此頁所有文字修改並還原">↺ 還原</button><span id="eb-msg"></span>`;
document.body.appendChild(bar);
document.getElementById('eb-toggle').onclick=()=>setEditing(!editing);
document.getElementById('eb-reset').onclick=()=>{if(confirm('還原此頁所有文字修改？')){localStorage.removeItem(KEY);location.reload()}};
document.getElementById('eb-copy').onclick=()=>{
  const d=load();let out=`【文字修改】${FILE}\n`,cnt=0;
  Object.keys(d.edits).forEach(k=>{const o=d.orig[k]||fresh[k]||[];(d.edits[k]||[]).forEach((t,i)=>{if(o[i]!==t){cnt++;out+=`\n${cnt}. 原：${(o[i]??'(?)').trim()}\n   改：${t.trim()}\n`}})});
  if(!cnt)out+='（目前沒有修改）';
  const done=()=>flash('已複製 ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(out).then(done,()=>fallbackCopy(out,done));else fallbackCopy(out,done)};
function fallbackCopy(t,cb){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();cb()}
let flTimer;function flash(m){const el=document.getElementById('eb-msg');if(!el)return;el.textContent=m;clearTimeout(flTimer);if(m&&m.includes('✓'))flTimer=setTimeout(()=>{el.textContent=editing?'編輯模式':''},1500)}
})();
</script>
</body>
</html>
