<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V9Bet · Sign up (Tailwind)</title>

<!-- variables.css holds every value. tailwind.config.js turns them into the theme
     and into the component classes (.btn, .field, .tab …) used below — the look
     is the live product's, Figma APP-V9Bet-v1. -->
<link rel="stylesheet" href="variables.css">
<script src="theme.js"></script>

<!-- No Node on this machine, so Tailwind runs from the CDN — but it reads the
     same tailwind.config.js a build would, so there is one theme, not two. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>var module = {};</script>
<script src="tailwind.config.js"></script>
<script>tailwind.config = module.exports;</script>
</head>

<body class="bg-app text-ink font-sans antialiased">
  <div class="min-h-[100dvh] flex justify-center bg-app">
    <div class="page w-full md:max-w-[440px] md:border-x md:border-edge-subtle min-h-[100dvh]">

      <div class="nav-top">
        <a href="index.html" aria-label="Close" class="nav-top-action"><span class="icon icon-close" aria-hidden="true"></span></a>
        <nav class="nav-tabs" aria-label="Sign up or log in"><span aria-current="page">Sign Up</span><a href="login-flow-tailwind.html">Log In</a></nav>
        
      </div>

      <div class="page-body">

        <div class="social-row">
          <button type="button" class="social-btn" data-social="google">
            <span class="social-btn-icon"><svg width="22" height="22" viewBox="0 0 48 48"><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2v6h7.6c4.4-4.1 7-10.1 7-17.7Z"/><path fill="#34A853" d="M24 47c6.3 0 11.6-2.1 15.5-5.7l-7.6-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.1 0-11.2-4.1-13.1-9.6h-7.8v6.1C7.3 41.9 15 47 24 47Z"/><path fill="#FBBC05" d="M10.9 27.9c-.5-1.4-.7-2.9-.7-4.4s.3-3.1.7-4.4v-6.1H3.1A23 23 0 0 0 1 23.5c0 3.7.9 7.2 2.5 10.2z"/><path fill="#EA4335" d="M24 10.2c3.4 0 6.5 1.2 8.9 3.5l6.7-6.7C35.6 3.2 30.3 1 24 1 15 1 7.3 6.1 3.9 13.5l7.8 6.1c1.9-5.6 7-9.4 13.1-9.4Z"/></svg></span>
            Google
          </button>
          <button type="button" class="social-btn" data-social="line">
            <span class="social-btn-icon"><img src="assets/social/line.png" alt=""></span>
            LINE
          </button>
          <button type="button" class="social-btn" data-social="zalo">
            <span class="social-btn-icon"><img src="assets/social/zalo.webp" alt=""></span>
            Zalo
          </button>
        </div>

        <div class="divider-label">or sign up with email</div>

        <!-- Email + a code is the whole registration: no password, no Account ID,
             no Captcha (signup-flow-wireframe.html). Referral sits under the one
             required field and never blocks sign-up. -->
        <div class="flex flex-col gap-2">
          <div class="field">
            <input id="email" type="email" inputmode="email" autocomplete="email" placeholder=" ">
            <label for="email">Email</label><fieldset aria-hidden="true"><legend><span>Email</span></legend></fieldset>
          </div>
          <div class="field">
            <input id="referral" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder=" ">
            <label for="referral">Referral Code (Optional)</label><fieldset aria-hidden="true"><legend><span>Referral Code (Optional)</span></legend></fieldset>
            <span class="field-trail" id="ref-note" hidden>From invite link <span class="icon icon-sm icon-check text-brand-2" aria-hidden="true"></span></span>
          </div>
        </div>

        <!-- Consent is the last thing before the button it unlocks, and it covers
             every method on this screen — the social icons included. -->
        <label class="flex items-center gap-2 min-h-[44px] cursor-pointer text-sm/6 font-light">
          <input id="terms" type="checkbox" class="sr-only">
          <span class="checkbox"></span>
          <span>You are 21+ years old and accept our <a href="system-pages-wireframe.html" class="text-brand-2">Terms of Service</a> and <a href="system-pages-wireframe.html" class="text-brand-2">Privacy Policy</a>.</span>
        </label>

        <button type="button" class="btn" id="submit" disabled>Sign Up</button>
      </div>
    </div>
  </div>

<script>
  const terms = document.getElementById('terms');
  const email = document.getElementById('email');
  const submit = document.getElementById('submit');
  /* The button stays grey until the form can be sent. */
  const sync = () => { submit.disabled = !terms.checked || !email.value.trim(); };
  terms.addEventListener('change', sync);
  email.addEventListener('input', sync);

  /* ?ref= prefills the field and says where the code came from. It stays
     editable; the note goes away the moment the member types their own. */
  const referral = document.getElementById('referral');
  const note = document.getElementById('ref-note');
  const fromLink = new URLSearchParams(location.search).get('ref');
  if (fromLink) { referral.value = fromLink; note.hidden = false; }
  referral.addEventListener('input', () => { note.hidden = !(fromLink && referral.value === fromLink); });
</script>
</body>
</html>
